name: Build Akane Injector (android12-5.10 / armeabi-v7a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r26d
        run: |
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Build akane.ko (android12-5.10)
        run: make module KERNELS=android12-5.10

      - name: Build akane-injector (armeabi-v7a)
        run: make injector ABI=armeabi-v7a

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akane-android12-5.10-armeabi-v7a
          path: |
            out/module/android12-5.10/akane.ko
            out/injector/name: Build Akane Injector (android12-5.10 / armeabi-v7a)

