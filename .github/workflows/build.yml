name: Build Akane Injector (android12-5.10 / armeabi-v7a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r26d
        run: |
          SDKMANAGER=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Build akane.ko (android12-5.10)
        run: make module KERNELS=android12-5.10

      - name: Build akane-injector (armeabi-v7a)
        run: make injector ABI=armeabi-v7a

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akane-android12-5.10-armeabi-v7a
          path: |
            out/module/android12-5.10/akane.ko
            out/injector/
